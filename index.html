<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Services Hub - Your Guide to Better Living</title>
    <link rel="stylesheet" href="vlogs.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- WORDPRESS: paste everything between this comment and the closing toast div into the HTML block -->

    <section class="articles-section" id="articles">
        <div class="container">
            <h3 class="footer-articles-title">Home Services Articles</h3>
            <div class="articles-grid" id="articlesGrid"></div>
            <div id="load-more-container" style="text-align:center;padding:20px 0;">
                <button class="load-more-btn" id="loadMoreBtn">Load More Articles</button>
            </div>
        </div>
    </section>

    <div class="modal-overlay" id="articleModal">
        <div class="modal-container">
            <button class="modal-close" id="modalClose">X</button>
            <div class="modal-content">
                <div class="modal-image">
                    <img src="" alt="" id="modalImage">
                    <div class="modal-video-duration" id="modalDuration"></div>
                </div>
                <div class="modal-body">
                    <div class="modal-meta">
                        <span class="modal-category" id="modalCategory"></span>
                        <span class="modal-date" id="modalDate"></span>
                    </div>
                    <h2 class="modal-title" id="modalTitle"></h2>
                    <div class="modal-text" id="modalText"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- WORDPRESS: end of HTML block paste. Load vlogs.js via WordPress enqueue or a script plugin -->

    <script src="vlogs3.js"></script>
</body>
</html>
